<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  <text x="20" y="40" font-family="Arial" font-size="16" fill="black">2x + 3 = 7</text>
  <text x="20" y="80" font-family="Arial" font-size="16" fill="black">2x = 7 - 3</text>
  <text x="20" y="120" font-family="Arial" font-size="16" fill="black">2x = 4</text>
  <text x="20" y="160" font-family="Arial" font-size="16" fill="black">x = 4/2</text>
  <text x="20" y="200" font-family="Arial" font-size="16" fill="black">x = 2</text>
</svg>
